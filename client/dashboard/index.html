<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard — Student Billing</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/dashboardHeader.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="../assets/css/branding.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="sidebar" aria-label="Primary navigation">
      <button class="mobile-nav-close" id="mobileNavClose" type="button" aria-label="Close navigation">&times;</button>
      <a class="logo product-logo-link" href="/">
        <span class="logo-surface"><img class="product-logo" src="../assets/images/NewLogo.png" alt="Institute logo"></span>
      </a>
      <nav id="sideNav"></nav>
    </aside>
    <div class="drawer-overlay" id="overlay" aria-hidden="true"></div>
    <div class="main">
      <header class="top">
        <div class="top-left"><button class="menu" id="menu" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">&#9776;</button></div>
        <div class="top-right">
          <div class="account-menu">
            <button class="avatar account-trigger" id="avatar" type="button" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false" aria-controls="accountDropdown">
              <svg class="account-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
            </button>
            <div class="account-dropdown" id="accountDropdown" role="menu" hidden>
              <a href="#settings" role="menuitem" data-account-settings>Institute Settings</a>
              <button type="button" role="menuitem" id="accountLogout" class="account-logout">Logout</button>
            </div>
          </div>
        </div>
      </header>
      <main class="workspace" id="workspace"><div class="skeleton"></div></main>
      <footer class="app-footer">
        <a href="https://creatifyagencies.com/" target="_blank" rel="noopener noreferrer">@creatifyagencies</a>
      </footer>
    </div>
  </div>
  <div id="globalModalRoot"></div>
  <div class="toast-stack"></div>
  <script type="module" src="../assets/js/workflow-dashboard.js"></script>
  <script type="module" src="../assets/js/dashboard.js"></script>
</body>
</html>
