<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose password — Cambridge Classes</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/global.css"><link rel="stylesheet" href="assets/css/auth.css"><link rel="stylesheet" href="assets/css/branding.css"></head><body class="auth-page" data-page="reset"><main class="card auth-card"><aside class="auth-aside"><a class="logo product-logo-link" href="/"><span class="logo-surface"><img class="product-logo" src="assets/images/NewLogo.png" alt="Cambridgeclasses- Smarter School Management"></span></a><div><h1>Choose a strong new password.</h1><p>Use uppercase, lowercase, a number, and a special character.</p></div></aside><section class="auth-main"><span class="tag">SECURE RESET</span><h2>Create a new password</h2><p>Choose a strong password you do not use elsewhere.</p><div id="message" class="message"></div><form data-auth><input type="hidden" name="token" id="token"><input type="hidden" name="email" id="email"><div class="form-field"><label for="password">New password</label><div class="password-control"><input id="password" name="password" type="password" autocomplete="new-password" required><button class="password-toggle" data-toggle-password aria-controls="password" type="button" aria-label="Show new password">Show</button></div></div><div class="form-field"><label for="confirmPassword">Confirm password</label><div class="password-control"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required><button class="password-toggle" data-toggle-password aria-controls="confirmPassword" type="button" aria-label="Show confirmed password">Show</button></div></div><button class="btn btn-primary" type="submit">Update password</button></form><a class="auth-return" href="login">← Return to login</a></section></main><script>const p=new URLSearchParams(location.search);document.querySelector('#token').value=p.get('token')||'';document.querySelector('#email').value=p.get('email')||''</script><script type="module" src="assets/js/auth.js"></script></body></html>
